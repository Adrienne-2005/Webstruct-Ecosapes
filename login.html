        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <link rel="stylesheet" href="newver.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="ecoscapes">
            <img class="ecoscapeslogo" src="./img/ecoscapes.png"><p>ECOSCAPES</p>
    </header>

    <div class="bgLogin"></div>
    <div class="login-parent">
        <div class="login-card">
            <div class="login-header">
                <h2>SIGN IN</h2>
            </div>

            <form id="loginForm">
                <!-- Email Input Group -->
                <div class="form-group">
                    <!-- placeholder=" " is critical for the CSS floating label effect -->
                    <h3>Username:</h3>
                    <input type="text" id="text" class="form-input" placeholder=" Enter you username " required>
                </div>

                <!-- Password Input Group -->
                <div class="form-group">
                    <h3>Password:</h3>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                </div>

                <!-- Options -->
                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Action Button -->
                <button type="submit" id="submit-btn" class="submit-btn" onclick="validate()">Sign in</button>
            </form>

            <div class="login-footer">
                Don't have an account? <a href="#" class="signup-link">Sign up</a>
            </div>
        </div>
    </div>

    <!-- Linking the external JavaScript logic -->
    <script src="./script/login.js"></script>
</body>
</html>
