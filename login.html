        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <!-- Linking the external stylesheet -->
    <link rel="stylesheet" href="newver.css">
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Log In for better Experience</h2>
            <p>Please enter your details to sign in</p>
        </div>

        <form id="loginForm">
            <!-- Email Input Group -->
            <div class="form-group">
                <!-- placeholder=" " is critical for the CSS floating label effect -->
                <input type="email" id="email" class="form-input" placeholder=" " required autocomplete="email">
                <label for="email" class="form-label">Email address</label>
            </div>

            <!-- Password Input Group -->
            <div class="form-group">
                <input type="password" id="password" class="form-input" placeholder=" " required autocomplete="current-password">
                <label for="password" class="form-label">Password</label>
            </div>

            <!-- Options -->
            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <!-- Action Button -->
            <button type="submit" class="submit-btn">Sign in</button>
        </form>

        <div class="login-footer">
            Don't have an account? <a href="#" class="signup-link">Sign up</a>
        </div>
    </div>

    <!-- Linking the external JavaScript logic -->
    <script src="./script/login.js"></script>
</body>
</html>
